# Omarchy Gothic Hyprlock Configuration
$font = Argor Flahm Scaqh
$font_serif = Cinzel Decorative
$font_mono = JetBrainsMono Nerd Font
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/omarchy/backgrounds/harbordark/HBG3.png
    blur_passes = 1
    blur_size = 3
}

input-field {
    monitor =
    size = 360, 52
    outline_thickness = 2
    inner_color = rgba(17, 17, 20, 0.90)

    outer_color = rgba(231, 90, 80, 0.95) rgba(169, 155, 122, 0.95) 45deg
    check_color = rgba(169, 155, 122, 0.95)
    fail_color = rgba(244, 67, 54, 0.95)

    font_color = rgb(231, 90, 80)
    fade_on_empty = false
    rounding = 0

    font_family = $font_mono
    placeholder_text = <span foreground="##a99b7ab3"><i>† ENTER OBSIDIAN VAULT †</i></span>
    fail_text = <span foreground="##f44336"><i>† $PAMFAIL †</i></span>

    dots_text_format = ◆
    dots_size = 0.35
    dots_spacing = 0.4
    dots_center = true

    position = 0, 0
    halign = center
    valign = center
}

# TIME (Argor Flahm Scaqh Gothic)
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb(239, 235, 220)
    position = 0, -90
    halign = center
    valign = top
}

# DATE (Gothic Serif)
label {
    monitor =
    text = cmd[update:60000] echo "† $(date +"%A  ·  %d %B %Y" | tr '[:lower:]' '[:upper:]') †"
    font_size = 18
    font_family = $font_serif
    color = rgb(169, 155, 122)

    position = 0, -220
    halign = center
    valign = top
}

# GOTHIC ORNAMENT
label {
    monitor =
    text = ❖   †   ❖
    font_size = 15
    color = rgb(231, 90, 80)
    position = 0, -260
    halign = center
    valign = top
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 13
    font_family = $font_serif
    onclick = hyprctl switchxkblayout all next
    color = $lock_layout
    position = 0, -55
    halign = center
    valign = center
}
